# Dev infra — API y web se ejecutan en host; aquí solo servicios compartidos.
# Si ya tienes MySQL/Redis locales en 3306/6379, no levantes estos servicios
# o cambia los puertos publicados.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - freelance_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: freelance_central
      MYSQL_USER: freelance
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-freelance_dev_secret}
    volumes:
      - freelance_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "${MAILPIT_SMTP_PUBLISH_PORT:-1025}:1025"
      - "${MAILPIT_UI_PUBLISH_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  freelance_redis_data:
  freelance_mysql_data:
