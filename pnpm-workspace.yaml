packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: allowlist de install scripts (seguridad).
# Solo paquetes del toolchain Nuxt/Vite en apps/web — revisar en cada upgrade mayor.
# Ver: apps/web/README.md#build-scripts-permitidos
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  maplibre-gl: true
  unrs-resolver: true
  vue-demi: true
